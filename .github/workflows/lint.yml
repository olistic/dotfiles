name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the secret scan can see every commit, not just HEAD.
          fetch-depth: 0

      - name: Lint bash scripts
        run: shellcheck install.sh macos.sh .githooks/pre-commit

      # Sourced fragments have no shebang, so shellcheck needs the dialect
      # named explicitly. This is where the curly-quote MANPAGER bug lived.
      - name: Lint sourced shell fragments
        run: shellcheck --shell=bash .aliases .exports .path

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # shellcheck refuses zsh (SC1071), so parse-check these instead.
      - name: Syntax-check zsh scripts
        run: |
          zsh -n bootstrap.sh
          zsh -n .zshrc

      - name: Validate JSON
        run: jq -e . .claude/settings.json > /dev/null

      # Backstop for the pre-commit hook, which `--no-verify` can skip.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan history for secrets
        run: gitleaks git --redact --no-banner .
